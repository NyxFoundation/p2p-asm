[package]
name = "libp2p-asm-interop-peer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libp2p = { version = "=0.57.1", default-features = false, features = ["tokio", "quic", "ping", "ed25519", "secp256k1"] }
futures = "0.3.31"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time", "signal"] }
serde_json = "1.0"
